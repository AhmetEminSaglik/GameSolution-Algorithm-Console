# Paylasimli LOKAL gelistirme PostgreSQL'i.
# Amac: yan projelerin hepsi TEK bir Postgres instance'ini paylassin.
# Yeni proje gelince -> yeni PORT / yeni container degil, bu instance'in icine
# yeni ROLE + yeni DATABASE ac (bkz. postgre-connection.md).
#
# Tum ayarlar .env'den okunur; .env yoksa asagidaki :- varsayilanlari kullanilir
# (yani bu proje icin hicbir sey tanimlamadan da calisir).
#   cp .env.example .env   ve gerekiyorsa degerleri degistir.
#
# ┌─ VERI GUVENLIGI ────────────────────────────────────────────────────────┐
# │  docker compose down       -> durur, VERI KALIR   (bunu kullan)          │
# │  docker compose down -v    -> VOLUME SILINIR, TUM VERI GIDER (kullanma!) │
# └────────────────────────────────────────────────────────────────────────┘
#
# baslat:  docker compose up -d
# psql:    docker exec -it ${PG_CONTAINER} psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}

services:
  postgres:
    image: postgres:16
    container_name: ${PG_CONTAINER:-dev-postgres}
    restart: unless-stopped
    environment:
      # Bu degerler SADECE volume ilk olusurken (ilk `up`) uygulanir.
      # Sonradan degistirmek icin: yeni ROLE/DATABASE ac (postgre-connection.md).
      POSTGRES_DB: ${POSTGRES_DB:-pathexplorer}
      POSTGRES_USER: ${POSTGRES_USER:-pathexplorer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathexplorer}
    ports:
      # host portu .env'den (PG_PORT), container icinde her zaman 5432.
      - "${PG_PORT:-5443}:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
      # initdb/*.sql SADECE volume ilk olusurken calisir. Sonradan proje
      # eklerken elle uygula:
      #   docker exec -i ${PG_CONTAINER} psql -U <user> -d <db> < yol/schema.sql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathexplorer} -d ${POSTGRES_DB:-pathexplorer}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev_pgdata:
