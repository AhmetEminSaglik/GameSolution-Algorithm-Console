# PathExplorer DB baglanti ayarlari.
# Paylasimli lokal Postgres (docker-compose.yml -> dev-postgres, port 5443),
# "pathexplorer" database'i.  Baslat: docker compose up -d
#
# Remote/prod icin bu dosyayi degistirmek yerine ortam degiskeni kullan:
#   PATHEXPLORER_DB_URL / PATHEXPLORER_DB_USER / PATHEXPLORER_DB_PASSWORD
# Ortam degiskeni her zaman bu dosyayi ezer.

url=jdbc:postgresql://localhost:5443/pathexplorer?reWriteBatchedInserts=true
user=pathexplorer
password=pathexplorer
batchSize=1000
