# PathExplorer DB baglanti ayarlari.
# Paylasimli lokal Postgres (docker-compose.yml -> dev-postgres, port 5443),
# "pathexplorer" database'i.  Baslat: docker compose up -d
#
# Remote/prod icin bu dosyayi degistirmek yerine ortam degiskeni kullan:
#   PATHEXPLORER_DB_URL / PATHEXPLORER_DB_USER / PATHEXPLORER_DB_PASSWORD
# Ortam degiskeni her zaman bu dosyayi ezer.

url=jdbc:postgresql://localhost:5443/pathexplorer?reWriteBatchedInserts=true
user=pathexplorer
password=pathexplorer
batchSize=1000

# --- Checkpoint (SADECE Algoritma 2) ---
# Her cozumu saklamak yerine cozucu state'ini her S cozumde bir kaydeder.
# Ac: checkpoint.enabled=true  (ya da Main'e --checkpoint argumani / PATHEXPLORER_CHECKPOINT_ENABLED=1)
checkpoint.enabled=false
checkpoint.interval.5x5=1000
checkpoint.interval.6x6=10000
checkpoint.interval.default=100000
checkpoint.flushEvery=200
# PATHEXPLORER_CHECKPOINT_INTERVAL verilirse tum boyutlar icin o araligi kullanir.
